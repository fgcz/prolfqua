name: R-CMD-check-prolfqua

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r-version: ['4.5.2']

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libicu-dev pandoc

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::covr

      - name: R CMD check
        uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"error"'

      - name: Code coverage
        if: success()
        run: covr::codecov(type = "all", token = Sys.getenv('CODECOV_TOKEN'))
        shell: Rscript {0}

      - name: Run goodpractice report
        if: always()
        continue-on-error: true
        run: |
          mkdir -p goodpractice-report
          Rscript -e 'result <- goodpractice::gp("."); print(result); saveRDS(result, "goodpractice-report/result.rds")' \
            > goodpractice-report/report.txt 2>&1

      - name: Upload goodpractice report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goodpractice-${{ runner.os }}-R-${{ matrix.r-version }}
          path: goodpractice-report
          if-no-files-found: warn
